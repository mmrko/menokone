<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helsinki / Menokone</title>
  <style>
    body,
    html {
      font-family: "Source Sans Pro", Robto, sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle, rgb(114 121 190 / 20%) 0%, rgb(27 31 64 / 90%) 100%);
      background-size: cover;
      height: 100%;
    }

    .ellipsify {
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .page-title {
      display: inline-block;
      margin: 0;
      -webkit-text-stroke-width: 1pt;
      -webkit-text-stroke-color: #333;
      color: #eee;
    }

    .qr-arrow {
      position: absolute;
      height: 5em;
      bottom: 0em;
      left: 94.6%;
      transform: rotate(30deg);
      filter: invert(1) drop-shadow(1px 3px 1px black);
    }

    .container {
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 2em;
      width: 90%;
      padding: 1em;
    }

    .card {
      position: relative;
      width: auto;
      height: calc(460px * 9 / 16);
      background-color: #fff;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .card-cover {
      width: 100%;
      height: 60%;
      object-fit: cover;
      object-position: 0 -0.5em;
    }

    .card-link {
      width: 100%;
      height: 60%;
      position: absolute;
      z-index: 1;
    }

    .card-title,
    .card-details {
      margin: 0.25em 0.5em;
      width: 75%;
    }

    .card-title {
      font-size: 18px;
      color: #333;
    }

    .card-details {
      padding: 0;
      list-style-type: none;
      font-size: 0.75em;
      margin-top: 0;
      margin-left: 0.75em;
    }

    .card-details img {
      vertical-align: middle;
    }

    .card-details li {
      margin-bottom: 0.25em;
    }

    .badge {
      font-size: 0.8em;
      background-color: #2868e5;
      border-radius: 5px;
      margin: 0 0.5em;
      padding: 0.25em 0.5em;
      width: fit-content;
      color: white;
      position: absolute;
      top: 0.5em;
    }

    .badge-right {
      right: -0.5em;
      border-radius: 5px 0 0 5px;
    }

    .badge-right-top {
      background-color: orange;
    }

    .badge-right-bottom-corner {
      background-color: green;
      top: 45%;
    }

    .qr-code {
      position: absolute;
      bottom: 0.5em;
      right: 0.5em;
    }

    .qr-hint-container {
      position: relative;
    }

    /* FAVORITE BUTTON */
    .heart-container {
      display: none;
      position: absolute;
      bottom: 10%;
      right: -5%;
      transform: scale(0.6);
      user-select: none;
    }

    .heart-container .label {
      height: 100px;
      width: 100px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      cursor: pointer;
    }

    .heart-container .heart {
      display: grid;
      place-items: center;
      position: relative;
    }

    .heart-container svg {
      height: 60px;
      fill: rgb(168, 170, 181);
      transition: all 500ms ease-in-out;
    }

    .heart-container svg:nth-child(2) {
      position: absolute;
      z-index: 2;
    }

    .heart-container input {
      opacity: 0;
      position: absolute;
    }

    .heart-container input:checked+.heart svg {
      fill: red;
    }

    .heart-container input:checked+.heart svg:nth-child(2) {
      filter: opacity(1);
      animation: heart 0.3s linear forwards;
    }

    @keyframes heart {
      to {
        transform: scale(1.4);
        filter: opacity(0);
        fill: red;
      }
    }

    /* FAVORITE BUTTON */

    @media (max-width: 1400px) {

      .qr-hint-container,
      #date {
        display: none;
      }
    }

    @media only screen and (max-device-width: 480px) {
      .page-title {
        -webkit-text-stroke-width: 0;
      }

      .heart-container {
        display: block;
      }

      .container {
        grid-template-columns: repeat(1, 1fr);
        grid-gap: 1em;
        width: auto;
        padding: 0.5em;
      }

      .card {
        margin-bottom: 1em;
      }

      .qr-hint-container,
      #date,
      .qr-code {
        display: none;
      }
    }
  </style>

      <h1 class="page-title">Menokone</h1>
    </a>
  </div>
  <span id="date" style="position: absolute;top:1.25em;right: 5%;font-size: 1.5em; color:#eee;"></span>
  <div class="container" id="cardContainer"></div>
  <div class="qr-hint-container">
    <p style="color: white; position: absolute; right: 4.5%; font-family: monospace; margin: 0;">
      <img src="phone.svg" style="color: white;filter: invert(1);vertical-align: middle;right: 10em;"> Skannaa QR-koodi
      puhelimellasi
    </p>
    <img src="arrow.png" class="qr-arrow">
  </div>

  <script>
    const CARD_COUNT = isMobile() ? 50 : 9
    const CARD_OFFSET = 0
    const HOURS_UNTIL_EVENT = window.location.search.includes("hours_until") ? new URLSearchParams(window.location.search).get("hours_until") : null
    const MAX_CARD_TITLE_LENGTH = isMobile() ? 70 : 80
    const timeZone = "Europe/Helsinki";
    const dateTimeOptions = {
      weekday: 'short',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit',
      hour12: false,
      timeZone
    };
    const dateTimeFormat = new Intl.DateTimeFormat('fi-FI', dateTimeOptions);

    const hourFormat = new Intl.DateTimeFormat('fi-FI', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
      timeZone
    });

    function isMobile() {
      return window.innerWidth < 768;
    }

    function updateDateTime() {
      const element = document.getElementById("date");
      if (element) {
        element.textContent = dateTimeFormat.format(new Date());
      }
    }

    function isToday(date) {
      var today = new Date();
      today.setUTCHours(0, 0, 0, 0);
      const givenDate = new Date(date);
      return isSameDay(today, givenDate)
    }

    function todayIsBetween(start, end) {
      const now = new Date();
      return new Date(start) <= now && now <= new Date(end);
    }

    function isSameDay(dateA, dateB) {
      return dateA.getUTCFullYear() === dateB.getUTCFullYear() &&
        dateA.getUTCMonth() === dateB.getUTCMonth() &&
        dateA.getUTCDate() === dateB.getUTCDate();
    }

    const now = new Date();
    const delayUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
    const placeholderImage = "data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==";
    const getOptions =
    {
      headers: {
        accept: "application/json",
        "cache-control": "no-cache",
      },
      body: null,
      method: "GET",
    }
    const categories = {
      "AllCategories": "Kaikki kategoriat",
      "ArtAndDesign": "Taide ja design",
      "Business": "Bisnes",
      "Concerts": "Konsertit",
      "LecturesAndGuidedTours": "Luennot ja opastukset",
      "Dance": "Tanssi",
      "Entertainment": "Viihde",
      "Exhibitions": "Näyttelyt",
      "GigsAndClubs": "Keikat ja klubit",
      "Movies": "Elokuvat",
      "Others": "Muut",
      "DanceAndCircus": "Tanssi ja sirkus",
      "SportsEvents": "Urheilutapahtumat",
      "ExerciseAndOutdoor": "Liikunta ja ulkoilu",
      "Theatre": "Teatteri",
      "TheatreAndOpera": "Teatteri ja ooppera",
      "TradeshowsAndSales": "Messut ja myyjäiset",
      "NonProfessionalEvents": "Aatteelliset tapahtumat",
      "Associations": "Yhdistykset"
    }

    const cache = JSON.parse(localStorage.getItem("cache") || "{}")

    if (!cache.lastUpdated || !isToday(cache.lastUpdated)) {
      refetchCards((cards) => {
        renderCards(cards)
        localStorage.setItem("cache", JSON.stringify({ cards, lastUpdated: new Date().toISOString() }))
      })
    }


    function refetchCards(cb) {
      fetch(`https://floud-prod-api-management.azure-api.net/api/v1/events/all?authorize=false&pageNumber=1&pageSize=500&excludeMoviesAndExhibitions=true&includeAdults=true&includeKids=true&includeSeniors=true&locations=Helsinki&fromDate=${new
        Date().toISOString()}`, getOptions
      ).then(async (eventsRes) => {
        const data = await eventsRes.json()
        const cards = data.Items.filter((item) => {
          return item.Dates.some((d) => new Date(d.End) > new Date())
        }).sort(
          (itemA, itemB) => {
            const dateA = itemA.Dates.find((d) => new Date(d.End) > new Date())
            const dateB = itemB.Dates.find((d) => new Date(d.End) > new Date())
            const dateDiff = new Date(dateA.Start) - new Date(dateB.Start)

            return dateDiff
          }
        ).map((item, index) => {
          const date = item.Dates.find((d) => new Date(d.End) > new Date())

          return {
            badge: categories[item.Category],
            title: item.Name,
            img: item.ImageUrl || "placeholder.png",
            url: `https://www.hs.fi/menokone/events/${item.Id}`,
            date,
            isToday: isToday(date.Start) || todayIsBetween(date.StartUtc, date.EndUtc),
            location: `${item.VenueName}${item.Address ? ', ' + item.Address.split(",")[0] : ''}`,
            forSeniors: item.Tag === "ForSeniors",
            forKids: item.Tag === "ForKids",
            index
          }
        })

        cb(cards)
      })
    }

    setTimeout(function () {
      updateDateTime();
      setInterval(updateDateTime, 60 * 1000);
    }, delayUntilNextMinute);

    updateDateTime();

    function createCard(cardData) {
      const card = document.createElement('div');
      const title = (cardData.title || '').length > MAX_CARD_TITLE_LENGTH ? (cardData.title || '').slice(0, MAX_CARD_TITLE_LENGTH - 3) + '...' : cardData.title;
      let dateStr = ""

      if (cardData.date)
        dateStr = isSameDay(new Date(cardData.date.StartUtc), new Date(cardData.date.EndUtc)) ? `${dateTimeFormat.format(new Date(cardData.date.Start))} – ${hourFormat.format(new Date(cardData.date.End))}` : `${dateTimeFormat.format(new Date(cardData.date.Start))} – ${dateTimeFormat.format(new Date(cardData.date.End))}`;

      card.className = 'card';
      card.innerHTML = `
    <a class="card-link" href="${cardData.url}" target="_blank"></a>
    <img src="${cardData.img}" class="card-cover" alt="${cardData.title}">
    <h5 class="card-title">${title || ""}</h5>
    <ul class="card-details">
      <li><img src="calendar.svg"> ${dateStr}</li>
      <li class="ellipsify"><img src="location.svg"> ${cardData.location || ""}</li>
    </ul>
    <span class="badge">${cardData.badge || ""}</span>
    ${cardData.isToday ? `<span class="badge badge-right badge-right-top">Tänään</span>` : ""}
    ${cardData.forSeniors || cardData.forKids ? `<span class="badge badge-right badge-right-bottom-corner">${cardData.forSeniors ? "Senioreille" : "Lapsille"}</span>` : ""}
    <span class="qr-code"></span>
    <div class="heart-container">
      <label for="favorite-${cardData.index}">
        <div class="label">
          <input type="checkbox" id="favorite-${cardData.index}" data-idx="${cardData.index}">
          <div class="heart">
            <svg viewBox="0 0 544.582 544.582">
              <path d="M448.069,57.839c-72.675-23.562-150.781,15.759-175.721,87.898C247.41,73.522,169.303,34.277,96.628,57.839
        C23.111,81.784-16.975,160.885,6.894,234.708c22.95,70.38,235.773,258.876,263.006,258.876
        c27.234,0,244.801-188.267,267.751-258.876C561.595,160.732,521.509,81.631,448.069,57.839z">
            </svg>
            <svg viewBox="0 0 544.582 544.582">
              <path d="M448.069,57.839c-72.675-23.562-150.781,15.759-175.721,87.898C247.41,73.522,169.303,34.277,96.628,57.839
        C23.111,81.784-16.975,160.885,6.894,234.708c22.95,70.38,235.773,258.876,263.006,258.876
        c27.234,0,244.801-188.267,267.751-258.876C561.595,160.732,521.509,81.631,448.069,57.839z">
            </svg>
          </div>
        </div>
      </label>
    </div>
  `;
      return card;
    }

    function isMorning() {
      return new Date().getHours() < 12
    }

    function renderCards(cards) {
      cards = cards.filter((item) => {
        const thresholdHours = HOURS_UNTIL_EVENT || (isMorning() ? 2.5 : 1.75)
        return item.IsSoldOut || new Date(item.date.Start) - new Date() > thresholdHours * 60 * 60 * 1000
      })

      const offset = (cards.length - (CARD_OFFSET + CARD_COUNT)) > 0 ? CARD_OFFSET : cards.length - CARD_COUNT
      const sortedCards = cards.slice(offset, CARD_COUNT + offset).sort((a, b) => new Date(a.date.StartUtc) - new Date(b.date.StartUtc))

      const container = document.getElementById('cardContainer');
      container.innerHTML = '';
      sortedCards.forEach(card => {
        const el = createCard(card)
        container.appendChild(el)
        new QRCode(el.getElementsByClassName('qr-code')[0], {
          text: card.url,
          width: 84,
          height: 84,
          colorDark: '#000',
          colorLight: '#fff',
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    }

    const fallbackCards = cache.cards || Array.from({ length: 9 }).map(() => ({ img: placeholderImage, date: {} }))

    renderCards(fallbackCards);
  </script>
</body>

</html>
